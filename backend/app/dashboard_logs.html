<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101116">
    <title>Logs complets · MelodiScan</title>
    <link rel="stylesheet" href="/assets/dashboard.css">
    <style>
        main { max-width: 1240px; margin: 0 auto; padding: 0 24px 40px; }
        .toolbar, .log-entry, .log-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        h2 { margin: 0; font-size: 16px; }
        .refresh, .copy-logs { color: var(--text); border: 1px solid var(--border); border-radius: 9px;
            background: rgba(255,255,255,.035); padding: 10px 14px; cursor: pointer; transition: .18s ease; }
        .refresh:hover, .copy-logs:hover:not(:disabled) { border-color: rgba(167,139,250,.45); background: rgba(167,139,250,.08); }
        .copy-logs:disabled { opacity: 0.5; cursor: not-allowed; }
        .layout {
            display: grid;
            grid-template-columns: minmax(250px, 330px) minmax(0, 1fr);
            gap: 15px;
        }
        .panel {
            min-width: 0;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: linear-gradient(145deg, rgba(28,29,39,.96), rgba(23,24,32,.96));
            box-shadow: 0 10px 28px rgba(0,0,0,.12);
            animation: rise-in .45s both;
        }
        .toolbar { margin-bottom: 14px; }
        #task-list { display: grid; gap: 8px; }
        .log-entry {
            width: 100%;
            padding: 12px;
            color: var(--text);
            text-align: left;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(255,255,255,.025);
            cursor: pointer;
            transition: border-color .18s ease, background .18s ease, transform .18s ease;
        }
        .log-entry:hover { border-color: rgba(167,139,250,.35); transform: translateX(2px); }
        .log-entry.selected { border-color: var(--primary); background: rgba(167,139,250,.08); }
        .log-entry strong { display: block; overflow-wrap: anywhere; }
        .log-entry small, .muted { color: var(--text-muted); }
        .log-entry small { display: block; margin-top: 5px; }
        #diagnostics {
            min-height: 300px;
            max-height: 68vh;
            overflow: auto;
            margin: 14px 0 0;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(9,10,15,.8);
            color: #e2e8f0;
            font: 13px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .error { color: var(--error); }
        #input-preview {
            margin-top: 16px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(9,10,15,.8);
        }
        #input-preview h2 { margin-bottom: 10px; }
        #input-preview-meta { margin-bottom: 10px; }
        #input-preview img, #input-preview iframe {
            display: block;
            width: 100%;
            max-height: 65vh;
            border: 0;
            border-radius: 6px;
            background: white;
            object-fit: contain;
        }
        #input-preview iframe { height: 65vh; }
        @media (max-width: 760px) {
            main { padding: 0 12px 28px; }
            .layout { grid-template-columns: 1fr; }
            #diagnostics { max-height: 55vh; }
        }
    </style>
</head>
<body>
<main>
    <!-- DASHBOARD_NAV -->
    <div class="page-heading">
        <div>
            <div class="eyebrow">SUIVI & DIAGNOSTIC</div>
            <h1>Traitements</h1>
            <p>Consultez les étapes détaillées et les fichiers reçus par le serveur.</p>
        </div>
    </div>
    <div class="layout">
        <section class="panel">
            <div class="toolbar">
                <h2>Traitements récents</h2>
                <button class="refresh" id="refresh" type="button">Actualiser</button>
            </div>
            <div id="task-list" class="muted">Chargement des tâches…</div>
        </section>
        <section class="panel">
            <div class="log-toolbar">
                <h2 id="log-title">Sélectionnez un traitement</h2>
                <button class="copy-logs" id="copy-logs" type="button" disabled>Copier les logs</button>
            </div>
            <div id="log-meta" class="muted" style="margin-top: 7px;"></div>
            <div id="copy-status" class="muted" role="status" aria-live="polite"></div>
            <div id="input-preview" hidden>
                <h2>Fichier reçu par le serveur</h2>
                <div id="input-preview-meta" class="muted">Sélectionnez un traitement pour afficher son fichier.</div>
                <div id="input-preview-content"></div>
            </div>
            <pre id="diagnostics" class="muted">Les diagnostics apparaîtront ici.</pre>
        </section>
    </div>
</main>
<script>
    let recentTasks = [];
    let selectedTaskId = '';
    let detailsLoading = false;

    async function apiRequest(url) {
        const response = await fetch(url, { cache: 'no-store' });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.detail || `Erreur HTTP ${response.status}`);
        return payload;
    }

    function formatDate(value) {
        if (!value) return 'Date inconnue';
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? 'Date inconnue' : date.toLocaleString('fr-FR');
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, character => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[character]);
    }

    function statusLabel(status) {
        return ({
            STATUS_QUEUED: 'En attente',
            STATUS_PROCESSING_IMAGE: 'Validation',
            STATUS_RUNNING_OMR: 'Audiveris',
            STATUS_BUILDING_MUSICXML: 'MusicXML',
            STATUS_EXPORTING_MIDI: 'Conversion MIDI',
            STATUS_COMPLETED: 'Terminée',
            STATUS_FAILED: 'Échec'
        })[status] || status || 'Inconnue';
    }

    async function showTask(taskId) {
        if (detailsLoading) return;
        const selectedTaskChanged = selectedTaskId !== taskId;
        selectedTaskId = taskId;
        document.querySelectorAll('.log-entry').forEach(button => {
            button.classList.toggle('selected', button.dataset.taskId === taskId);
        });
        const task = recentTasks.find(item => item.task_id === taskId);
        if (!task) return;
        document.getElementById('log-title').textContent = task.title || 'Partition sans titre';
        document.getElementById('log-meta').textContent =
            `ID ${task.task_id} · ${statusLabel(task.status)} · ${formatDate(task.failed_at || task.completed_at || task.created_at)}`;
        const output = document.getElementById('diagnostics');
        const previewMeta = document.getElementById('input-preview-meta');
        const previewContent = document.getElementById('input-preview-content');
        if (selectedTaskChanged) {
            document.getElementById('copy-logs').disabled = true;
            document.getElementById('copy-status').textContent = '';
            output.classList.remove('error');
            output.textContent = 'Chargement des logs…';
            previewMeta.textContent = 'Chargement du fichier reçu…';
            previewContent.replaceChildren();
        }
        detailsLoading = true;
        try {
            const details = await apiRequest(`/api/v1/tasks/${encodeURIComponent(taskId)}/logs`);
            document.getElementById('log-meta').textContent =
                `ID ${taskId} · ${statusLabel(details.status)} · ${formatDate(details.failed_at || details.completed_at || details.created_at)}`;
            const shouldScroll = output.scrollHeight - output.scrollTop - output.clientHeight < 40;
            output.textContent = details.logs;
            document.getElementById('copy-logs').disabled = !details.logs;
            output.classList.remove('error');
            if (shouldScroll) output.scrollTop = output.scrollHeight;
            const preview = details.input_preview;
            document.getElementById('input-preview').hidden = !preview;
            if (selectedTaskChanged && !preview) {
                previewMeta.textContent = 'Le fichier reçu n’est plus disponible pour cette tâche.';
            } else if (selectedTaskChanged && preview) {
                previewMeta.textContent =
                    `${preview.filename} · ${Number(preview.size_bytes).toLocaleString('fr-FR')} octets`;
                if (preview.media_type === 'application/pdf') {
                    const frame = document.createElement('iframe');
                    frame.title = 'PDF reçu par le serveur';
                    frame.src = preview.url;
                    previewContent.append(frame);
                } else if (preview.media_type.startsWith('image/')) {
                    const image = document.createElement('img');
                    image.alt = 'Image reçue par le serveur';
                    image.onload = () => {
                        previewMeta.textContent += ` · ${image.naturalWidth} × ${image.naturalHeight} px`;
                    };
                    image.onerror = () => {
                        previewMeta.textContent = 'Impossible d’afficher le fichier image reçu.';
                    };
                    image.src = preview.url;
                    previewContent.append(image);
                } else {
                    previewMeta.textContent = 'Format de fichier non affichable.';
                }
            }
        } catch (error) {
            document.getElementById('copy-logs').disabled = true;
            output.textContent = error.message;
            output.classList.add('error');
            previewMeta.textContent = 'Impossible de charger le fichier reçu.';
        } finally {
            detailsLoading = false;
        }
    }

    async function copyLogs() {
        const logs = document.getElementById('diagnostics').textContent;
        const status = document.getElementById('copy-status');
        if (!logs) return;
        try {
            if (!navigator.clipboard?.writeText) {
                throw new Error('La copie n’est pas disponible dans ce navigateur.');
            }
            await navigator.clipboard.writeText(logs);
            status.textContent = 'Logs copiés.';
            status.classList.remove('error');
        } catch (error) {
            status.textContent = `Impossible de copier les logs : ${error.message}`;
            status.classList.add('error');
        }
    }

    async function loadTasks() {
        const list = document.getElementById('task-list');
        list.textContent = 'Chargement des tâches…';
        try {
            const data = await apiRequest('/api/v1/stats');
            recentTasks = data.recent_tasks || [];
            if (!recentTasks.length) {
                list.textContent = 'Aucun traitement récent.';
                document.getElementById('log-title').textContent = 'Aucun traitement';
                document.getElementById('log-meta').textContent = '';
                document.getElementById('diagnostics').textContent = 'Aucun log à afficher.';
                selectedTaskId = '';
                return;
            }
            list.innerHTML = recentTasks.map(task => `
                <button class="log-entry" type="button" data-task-id="${escapeHtml(task.task_id)}">
                    <span><strong>${escapeHtml(task.title || 'Partition sans titre')}</strong>
                    <small>${escapeHtml(formatDate(task.failed_at || task.completed_at || task.created_at))}</small></span>
                    <small class="${task.status === 'STATUS_FAILED' ? 'error' : ''}">${escapeHtml(statusLabel(task.status))}</small>
                </button>`).join('');
            list.querySelectorAll('.log-entry').forEach(button => {
                button.addEventListener('click', () => showTask(button.dataset.taskId));
            });
            const requestedId = new URLSearchParams(location.search).get('task_id');
            const nextTaskId = recentTasks.some(task => task.task_id === requestedId)
                ? requestedId
                : recentTasks.some(task => task.task_id === selectedTaskId)
                    ? selectedTaskId
                    : recentTasks[0].task_id;
            await showTask(nextTaskId);
        } catch (error) {
            list.textContent = `Impossible de charger les traitements : ${error.message}`;
            list.classList.add('error');
        }
    }

    document.getElementById('refresh').addEventListener('click', loadTasks);
    document.getElementById('copy-logs').addEventListener('click', copyLogs);
    loadTasks();
    setInterval(() => {
        if (selectedTaskId) showTask(selectedTaskId);
    }, 1500);
</script>
</body>
</html>
