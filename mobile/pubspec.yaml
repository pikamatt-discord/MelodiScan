name: melodiscan_mobile
description: MelodiScan Mobile Application - OMR Score Digitization & Interactive Player

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  flutter_svg: ^2.2.3
  http: ^1.1.2
  crypto: ^3.0.8
  path_provider: ^2.1.2
  image_picker: ^1.0.7
  cupertino_icons: ^1.0.8
  file_picker: 8.1.7
  flutter_midi_pro: 4.0.4
  pdfx: 2.11.0
  dart_midi_pro: 1.0.4+2
  shared_preferences: ^2.5.3
  xml: ^6.6.1
  verovio_flutter: ^0.3.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/melodiscan_icon.png
  adaptive_icon_background: "#0D0E15"
  adaptive_icon_foreground: assets/images/melodiscan_icon_foreground.png
  adaptive_icon_foreground_inset: 14

flutter:
  uses-material-design: true
  assets:
    - assets/images/melodiscan_logo.svg
    - assets/soundfonts/COPYRIGHT.txt
    - assets/soundfonts/instruments.sf2
